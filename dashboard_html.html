function findPos(rows, text, exact) {
  var s = text.toLowerCase().trim();
  for (var r=0;r<rows.length;r++) {
    if (!rows[r]||!rows[r].c) continue;
    for (var c=0;c<rows[r].c.length;c++) {
      var cell=rows[r].c[c];
      var v=String(cell?(cell.v!=null?cell.v:(cell.f||'')):'' ).toLowerCase().trim();
      if (exact?v===s:v.indexOf(s)>=0) return [r,c];
    }
  }
  return null;
}

function cv(rows,r,c) {
  try{var x=rows[r]&&rows[r].c&&rows[r].c[c];return x?(x.v!=null?x.v:x.f):null;}catch(e){return null;}
}

function toNum(v,fb) {
  if (fb===undefined) fb=0;
  if (v==null) return fb;
  if (typeof v==='number') return v>=-1&&v<=1?+(v*100).toFixed(2):v;
  var s=String(v).trim().replace(/%/g,'');
  s=s.replace(/,(\d{1,2})$/,'.$1');
  s=s.replace(/[^0-9.\-]/g,'');
  return parseFloat(s)||fb;
}

function fmtDate(v) {
  if (!v) return '—';
  var s=String(v).trim();
  s=s.replace(/^[A-ZÁ-Úa-záéíóúà-ü]{2,5}\.?\s+/,'');
  if (/Date\(/.test(s)){var m=s.match(/Date\((\d+),(\d+),(\d+)/);if(m)return ('0'+m[3]).slice(-2)+'/'+('0'+(+m[2]+1)).slice(-2);}
  var p=s.slice(0,10).split('-');
  if (p.length===3) return p[2]+'/'+p[1];
  return s.slice(0,5);
}

function fmtPct(val) {
  var n = parseFloat(String(val).replace(/[^0-9.\-]/g,''))||0;
  if (n > 0 && n <= 1) n = Math.round(n * 100);
  else n = Math.round(n);
  return n + '%';
}

function fetchGviz(sheetId, sheetParam, range, noFilter) {
  var param = /^\d+$/.test(sheetParam) ? 'gid='+sheetParam : 'sheet='+encodeURIComponent(sheetParam);
  var url = 'https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?tqx=out:json&'+param;
  if (range) url += '&range=' + encodeURIComponent(range);
  if (noFilter) url += '&tq=' + encodeURIComponent('select *'); // ignora filtros ativos
  var done = false;
  return new Promise(function(resolve, reject) {
    setTimeout(function(){ if(!done){done=true;reject(new Error('Timeout'));}}, 12000);
    fetch(url,{cache:'no-store'}).then(function(res){return res.text();}).then(function(txt){
      if(done) return; done=true;
      var js=txt.match(/setResponse\(([\s\S]*?)\);?\s*$/);
      if(!js) return reject(new Error('Resposta inesperada.'));
      resolve(JSON.parse(js[1]).table.rows);
    }).catch(function(e){if(!done){done=true;reject(e);}});
  });
}

function parseControlDate(rows) {
  // A data de controle fica sempre em B3 (rows[2].c[1] no GViz)
  function extractDate(cell) {
    if (!cell) return null;
    var v = cell.v, f = String(cell.f != null ? cell.f : '').trim();
    // Caso 1: GViz retorna Date(yyyy, m0, d) — mês começa em 0
    if (typeof v === 'string' && /Date\(/.test(v)) {
      var m = v.match(/Date\((\d+),(\d+),(\d+)/);
      if (m) return ('0'+m[3]).slice(-2)+'/'+('0'+(+m[2]+1)).slice(-2);
    }
    // Caso 2: Serial numérico do Excel (ex: 46157 = 15/05/2026)
    if (typeof v === 'number' && v > 10000) {
      var d = new Date(Math.round((v - 25569) * 86400000));
      return ('0'+d.getUTCDate()).slice(-2)+'/'+('0'+(d.getUTCMonth()+1)).slice(-2);
    }
    // Caso 3: String formatada (pode ser mm/dd/aaaa ou dd/mm/aaaa)
    var s = f || String(v != null ? v : '').trim();
    var dm = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-]\d{2,4}/);
    if (dm) {
      var n1 = +dm[1], n2 = +dm[2];
      // Se n1 > 12, só pode ser dia → formato dd/mm
      // Se n2 > 12, só pode ser dia → formato mm/dd (GViz US locale)
      if (n2 > 12) return ('0'+n2).slice(-2)+'/'+('0'+n1).slice(-2); // dd/mm
      return ('0'+n1).slice(-2)+'/'+('0'+n2).slice(-2);              // assume dd/mm
    }
    return null;
  }
  // Tenta direto em B3 (índice linha 2, coluna 1)
  var b3 = rows[2] && rows[2].c && rows[2].c[1];
  var d = extractDate(b3);
  if (d) return d;
  // Fallback: varre primeiras 8 linhas (caso o layout mude)
  for (var r=0;r<Math.min(8,rows.length);r++) {
    if(!rows[r]||!rows[r].c) continue;
    for (var c=0;c<rows[r].c.length;c++) {
      d = extractDate(rows[r].c[c]);
      if (d) return d;
    }
  }
  return null;
}

function parseRelatorio(rows) {
  var rPct=82,pPct=79.5,dPct=2.55,totAc=72,atrs=26,dataAtual='';
  for (var dr=0;dr<Math.min(8,rows.length);dr++) {
    if (!rows[dr]||!rows[dr].c) continue;
    for (var dc=0;dc<rows[dr].c.length;dc++) {
      var c0=rows[dr].c[dc], val=String(c0?(c0.v!=null?c0.v:(c0.f||'')):'' ).trim();
      if (val.toLowerCase().indexOf('atualiza')>=0) {
        var dm=val.match(/(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/);

    }
    if(dataAtual) break;
  }
  var concPos=findPos(rows,'CONCLU');
  if (concPos) {
    var lr=concPos[0],lc=concPos[1],dr2=lr-1;
    if (dr2>=0) {
      var v1=cv(rows,dr2,lc),v2=cv(rows,dr2,lc+1),v3=cv(rows,dr2,lc+2),v4=cv(rows,dr2,lc+3),v5=cv(rows,dr2,lc+4);
      if(v1!=null)rPct=toNum(v1,rPct); if(v2!=null)pPct=toNum(v2,pPct); if(v3!=null)dPct=toNum(v3,dPct);
      if(v4!=null&&!isNaN(+v4))totAc=+v4; if(v5!=null&&!isNaN(+v5))atrs=+v5;
    }
  }
  var devs=[{nm:'ADM do Brasil',qt:7,cor:'#dc2626'},{nm:'Irmãos Passaúra',qt:19,cor:'#2563eb'},{nm:'ADM + Irmãos Passaúra',qt:0,cor:'#9ca3af'}];
  var qtdPos=findPos(rows,'QTD DESVIOS');
  if (qtdPos) {
    var hr=qtdPos[0],hc=qtdPos[1],nc=hc-1;
    for (var i=0;i<3;i++) {
      var nm=String(cv(rows,hr+1+i,nc)||'').trim(),qt=cv(rows,hr+1+i,hc);
      if(nm&&qt!=null&&nm.toLowerCase().indexOf('total')<0) devs[i]={nm:nm,qt:Number(qt),cor:devs[i].cor};
    }
  }
  var totDv=devs.reduce(function(a,d){return a+Number(d.qt);},0)||1;
  var top20=[],allActs=[],edtPos=findPos(rows,'edt',true);
  var stPos=findPos(rows,'status',false); // coluna STATUS (pode ser nula)
  var stCol=stPos?stPos[1]:-1;
  if (edtPos) {
    var er=edtPos[0],ec=edtPos[1];
    for (var j=1;j<=500;j++) {
      var edt=cv(rows,er+j,ec);
      if(!edt) continue;                            // pula linhas vazias (células mescladas)
      if(!/^\d/.test(String(edt).trim())) continue; // ignora linhas que não são EDT
      if(allActs.length>=100) break;               // limite de segurança
      var obsC=rows[er+j]&&rows[er+j].c&&rows[er+j].c[ec+8];
      var obsV=obsC&&obsC.v!=null?String(obsC.v):'';
      var obsF=obsC&&obsC.f!=null?String(obsC.f):'';
      var obsText=(obsV.length>=obsF.length?(obsV||obsF):(obsF||obsV)).replace(/[\r\n\t]+/g,' ').trim()||'—';
      // allActs: todas as atividades (para gráfico de avanços)
      var _stRaw = stCol>=0 ? String(cv(rows,er+j,stCol)||'').toLowerCase() : '';
      var _stKey  = _stRaw.indexOf('conclu')>=0?'conc':
                    _stRaw.indexOf('andament')>=0?'and':
                    _stRaw.indexOf('atras')>=0?'atrs':
                    _stRaw.indexOf('iniciar')>=0?'ini':null;
      allActs.push({edt:String(edt),ativ:String(cv(rows,er+j,ec+1)||'—'),real:cpct(cv(rows,er+j,ec+2)),prev:cpct(cv(rows,er+j,ec+3)),stKey:_stKey});
      // top20: apenas as 20 primeiras (GS já pré-ordenado por desvio desc)
      if(top20.length<20){
        top20.push({edt:String(edt),ativ:String(cv(rows,er+j,ec+1)||'—'),real:cpct(cv(rows,er+j,ec+2)),prev:cpct(cv(rows,er+j,ec+3)),dev:toNum(cv(rows,er+j,ec+4)),term:fmtDate(cv(rows,er+j,ec+5)),area:String(cv(rows,er+j,ec+6)||'—'),resp:String(cv(rows,er+j,ec+7)||'—'),obs:obsText});
      }
    }
  }
  return {rPct:rPct,pPct:pPct,dPct:dPct,totAc:totAc,atrs:atrs,devs:devs,totDv:totDv,top20:top20,allActs:allActs,dataAtual:dataAtual};
}

// Converte valor percentual com segurança: trata float overflow (ex: 1.0000563→100)
function cpct(v) {
  if(v==null) return null;
  var n=(typeof v==='number')?v:parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(n)) return null;
  // Decimal 0-1 range (com margem para float): multiplica por 100
  if(n>=-1.05&&n<=1.05) n=Math.round(n*10000)/100;
  // Clamp final para [0, 100]
  return Math.min(Math.max(n,0),100);
}

function parseCurva(rows) {
  var prevRowIdx=-1,realRowIdx=-1,tendRowIdx=-1,dateRowIdx=-1;
  for (var r=0;r<rows.length;r++) {
    if(!rows[r]||!rows[r].c) continue;
    var c0=rows[r].c[0], a=String(c0?(c0.v!=null?c0.v:(c0.f||'')):'' ).toLowerCase();
    if(a.indexOf('prev')>=0&&a.indexOf('acum')>=0) prevRowIdx=r;
    if(a.indexOf('real')>=0&&a.indexOf('acum')>=0) realRowIdx=r;
    if(a.indexOf('tend')>=0&&a.indexOf('acum')>=0) tendRowIdx=r;
  }
  for (var r2=0;r2<rows.length;r2++) {
    if(!rows[r2]||!rows[r2].c) continue;
    var cnt=0;
    for (var ci=0;ci<rows[r2].c.length;ci++) {
      var cell=rows[r2].c[ci]; if(!cell) continue;
      var vf=String(cell.f!=null?cell.f:(cell.v!=null?cell.v:'')).toLowerCase();
      if(/\d{1,2}[\-\/][a-z]{2,4}/.test(vf)) cnt++;
    }
    if(cnt>=5){dateRowIdx=r2;break;}
  }
  if(prevRowIdx<0||dateRowIdx<0) return {labels:[],previsto:[],realizado:[],tendencia:[]};
  var dateRow=rows[dateRowIdx],prevRow=rows[prevRowIdx];
  var realRow=realRowIdx>=0?rows[realRowIdx]:null;
  var tendRow=tendRowIdx>=0?rows[tendRowIdx]:null;
  var maxCol=Math.max(dateRow.c?dateRow.c.length:0,prevRow.c?prevRow.c.length:0);
  var labels=[],previsto=[],realizado=[],tendencia=[];
  for (var c2=1;c2<maxCol;c2++) {
    var dCell=dateRow.c&&dateRow.c[c2]; if(!dCell) continue;
    var dv=dCell.f!=null?dCell.f:(dCell.v!=null?dCell.v:null); if(!dv) continue;
    var ds=String(dv).toLowerCase().replace(/\.$/,'').trim();
    if(!/\d/.test(ds)) continue;                       // sem dígito → pula
    if(/^[\d.e+\-]+$/.test(ds)) continue;              // número puro (ex: 1.0000563) → pula
    var pCell=prevRow.c&&prevRow.c[c2],pv=pCell?(pCell.v!=null?pCell.v:pCell.f):null; if(pv==null) continue;
    labels.push(ds); previsto.push(cpct(pv));
    var rCell=realRow&&realRow.c&&realRow.c[c2],rv=rCell?(rCell.v!=null?rCell.v:rCell.f):null;
    realizado.push(rv!=null?cpct(rv):null);
    var tCell=tendRow&&tendRow.c&&tendRow.c[c2],tv=tCell?(tCell.v!=null?tCell.v:tCell.f):null;
    tendencia.push(tv!=null?cpct(tv):null);
  }
  return {labels:labels,previsto:previsto,realizado:realizado,tendencia:tendencia};
}

function parseConcluidas(rows) {
  var result={total:'',periodo:'',rows:[]};
  var headers=['#','EDT','Atividade','HH Prev.','% Anterior','% Atual','Início','Término Real'];
  var headerRowIdx=-1, startCol=-1;
  for (var r=0;r<rows.length;r++) {
    if(!rows[r]||!rows[r].c) continue;
    var cells=rows[r].c;
    var rowText=cells.map(function(c){return c?String(c.v!=null?c.v:(c.f||'')).trim():'';});
    var rowStr=rowText.join('|').toLowerCase();
    if(rowStr.indexOf('total de atividades')>=0) {
      for(var ci=0;ci<rowText.length;ci++) {
        if(rowText[ci].toLowerCase().indexOf('total de atividades')>=0){result.total=rowText[ci+1]||rowText[ci+2]||'';break;}
      }
    }
    if(rowStr.indexOf('per')>=0&&rowStr.indexOf('nalise')>=0) {
      for(var ci2=0;ci2<rowText.length;ci2++) {
        var rv2=rowText[ci2].toLowerCase();
        if(rv2.indexOf('per')>=0&&rv2.indexOf('nali')>=0){result.periodo=rowText[ci2+1]||rowText[ci2+2]||'';break;}
      }
    }
    if(rowStr.indexOf('edt')>=0&&rowStr.indexOf('atividade')>=0&&headerRowIdx<0) {
      headerRowIdx=r;
      for(var hi=0;hi<rowText.length;hi++){if(rowText[hi]==='#'){startCol=hi;break;}}
      continue;
    }
    if(headerRowIdx>=0&&r>headerRowIdx&&startCol>=0) {
      if(!rowText.join('').trim()) continue;
      if(rowStr.indexOf('legenda')>=0||rowStr.indexOf('relat')>=0) break;
      var rowData=[];
      for(var di=startCol;di<startCol+8;di++) rowData.push(rowText[di]||'');
      if(rowData.filter(function(v){return v!=='';}).length>=2) result.rows.push(rowData);
    }
  }
  result.headers=headers;
  return result;
}

function parseStatusDist(rows) {
  // Range fixo B9:D15 → cells[0]=STATUS (col B), cells[1]=QTD (col C), cells[2]=%Total (col D)
  var sd = {conc:0, and:0, atrs:0, ini:0, total:0};
  for (var r=0; r<rows.length; r++) {
    if (!rows[r]||!rows[r].c) continue;
    var cells = rows[r].c;
    var c0 = cells[0]; if(!c0) continue;
    var label = String(c0.v!=null?c0.v:(c0.f||'')).toLowerCase().trim();
    if (label.length < 3) continue;
    // QTD está sempre em cells[1] (coluna C)
    var c1 = cells[1];
    var qty = c1 ? parseFloat(String(c1.v!=null?c1.v:0)) : 0;
    if (isNaN(qty)) qty = 0;
    if      (label.indexOf('em andamento')>=0) sd.and   = qty;
    else if (label.indexOf('a iniciar')   >=0) sd.ini   = qty;
    else if (label.indexOf('conclu')      >=0) sd.conc  = qty;
    else if (label.indexOf('atras')       >=0) sd.atrs  = qty;
    else if (label.indexOf('total')       >=0 && qty>0) sd.total = qty;
  }
  return sd;
}

function renderStatusChart(sd, allActs) {
  var el = document.getElementById('statusChart');
  if (!el) return;
  if (chartStatus) chartStatus.destroy();
  // Fallback: calcula via allActs se a aba não carregou
  if (!sd || (!sd.conc && !sd.and && !sd.atrs && !sd.ini)) {
    if (!allActs || !allActs.length) return;
    sd = {conc:0, and:0, atrs:0, ini:0, total:0};
    var hasStKey = allActs.some(function(a){return a.stKey;});
    allActs.forEach(function(a) {
      if (hasStKey) {
        // Usa coluna STATUS do GS se disponível
        if      (a.stKey==='conc') sd.conc++;
        else if (a.stKey==='and')  sd.and++;
        else if (a.stKey==='atrs') sd.atrs++;
        else if (a.stKey==='ini')  sd.ini++;
      } else {
        // Deriva de real/prev como fallback
        if      (a.real >= 99.9)              sd.conc++;
        else if (a.real===0 && a.prev===0)    sd.ini++;
        else if (a.real >= a.prev)            sd.and++;
        else                                  sd.atrs++;
      }
    });
    sd.total = allActs.length || (sd.conc+sd.and+sd.atrs+sd.ini);
  }
  Chart.register(ChartDataLabels);
  chartStatus = new Chart(el, {
    type: 'pie',
    plugins: [ChartDataLabels],
    data: {
      labels: [
        'Concluído ('    + sd.conc + ')',
        'Em Andamento (' + sd.and  + ')',
        'Atrasado ('     + sd.atrs + ')',
        'A Iniciar ('    + sd.ini  + ')'
      ],
      datasets: [{
        data: [sd.conc, sd.and, sd.atrs, sd.ini],
        backgroundColor: ['#1a6637','#2563eb','#dc2626','#f59e0b'],
        borderColor: '#fff',
        borderWidth: 2,
        hoverOffset: 8,
        datalabels: { display: false }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {font: {size: 11}, boxWidth: 13, padding: 10}
        },
        tooltip: {
          callbacks: {
            label: function(c){ return '  ' + c.label + ': ' + c.raw; }
          }
        }
      }
    }
  });
}

function buildTopAvancos(allActs, atualDate, antDate) {
  // Calcula avanços no período (Atual - Anterior)
  var advances = [];
  var atelDate = atualDate || '16/05';
  allActs.forEach(function(a) {
    var ant = ANTERIOR_DATA[a.edt];
    if (!ant) return;
    var adv = +(a.real - ant.real).toFixed(1);
    if (adv <= 0) return;
    advances.push({ativ: a.ativ.replace(/^\s+/,''), edt: a.edt,
                   atual: a.real, anterior: ant.real, adv: adv});
  });
  if (!advances.length) return '';
  advances.sort(function(a, b){ return b.adv - a.adv; });
  var top = advances.slice(0, 8);

  var h = top.length * 58 + 56;

    +'<div class="kpi r"><div class="kpi-lbl">Atrasadas</div><div class="kpi-val">'+d.atrs+'</div></div>'
    +'</div>'

    +'<div class="row3">'
    +'<div class="card"><div class="ct">Avanço físico</div>'
    +'<div class="pb-row"><div class="pb-lbl"><span>Realizado</span><span>'+d.rPct.toFixed(1)+'%</span></div>'
    +'<div class="pb-track"><div class="pb-fill" style="width:'+Math.min(d.rPct,100)+'%;background:linear-gradient(90deg,#34d399,#10b981 60%,#059669);box-shadow:0 2px 8px rgba(16,185,129,0.45)"></div></div></div>'
    +'<div class="pb-row"><div class="pb-lbl"><span>Previsto</span><span>'+d.pPct.toFixed(1)+'%</span></div>'
    +'<div class="pb-track"><div class="pb-fill" style="width:'+Math.min(d.pPct,100)+'%;background:linear-gradient(90deg,#e5e7eb,#9ca3af 60%,#6b7280);box-shadow:0 2px 6px rgba(107,114,128,0.35);animation-delay:.2s"></div></div></div>'
    +'<div class="st-box '+(ahead?'ok':'bad')+'">'+(ahead?'✔ Projeto adiantado':'⚠ Projeto atrasado')+' — '+(ahead?'+':'')+d.dPct.toFixed(2)+' p.p. '+(ahead?'acima':'abaixo')+' do previsto</div>'
    +'<div style="height:18px"></div><div class="ct">Desvios por responsável</div>'
    +d.devs.map(function(v){return '<div class="dv-row"><div class="dv-nm">'+v.nm+'</div><div class="dv-track"><div class="dv-fill" style="width:'+Math.round(v.qt/d.totDv*100)+'%;background:'+v.cor+'"></div></div><div class="dv-cnt">'+v.qt+'</div><div class="dv-pct">'+Math.round(v.qt/d.totDv*100)+'%</div></div>';}).join('')
    +'</div>'
    +'<div class="card"><div class="ct">Distribuição de desvios</div>'
    +'<div class="legend">'+d.devs.map(function(v){return '<div class="leg"><div class="leg-dot" style="background:'+v.cor+'"></div>'+v.nm+' — <strong>'+v.qt+'</strong> ('+Math.round(v.qt/d.totDv*100)+'%)</div>';}).join('')+'</div>'
    +'<div style="position:relative;height:190px"><canvas id="donut"></canvas></div>'
    +'<div style="margin-top:12px;padding:10px 14px;background:#fee2e2;border-radius:8px;font-size:12px;font-weight:600;color:#991b1b">Total: '+d.totDv+' desvios identificados</div>'
    +'</div>'
    +'<div class="card"><div class="ct" style="text-align:center">Distribuição por Status (Qtd.)</div>'
    +'<div style="position:relative;height:260px"><canvas id="statusChart"></canvas></div>'
    +'</div></div>'

    +'<div class="card-full"><div class="ct">Curva S — Avanço Físico Acumulado</div>'
    +'<div class="curva-leg">'
    +'<div class="curva-leg-item"><div class="curva-leg-line" style="background:#2563eb"></div>Previsto Acumulado</div>'
    +'<div class="curva-leg-item"><div class="curva-leg-line" style="background:#f59e0b"></div>Realizado Acumulado</div>'
    +'<div class="curva-leg-item"><div class="curva-leg-line" style="background:#10b981;border-top:2px dashed #10b981;height:0"></div>Tendência Acumulada</div>'
    +'</div><div style="position:relative;height:300px"><canvas id="curvaChart"></canvas></div></div>'

    +'<div class="card-full"><div class="ct">Top 20 — atividades críticas (maior desvio) <span style="font-size:10px;font-weight:400;color:#9ca3af">— clique na linha para ver a observação</span></div>'
    +(d.top20.length===0?'<p style="font-size:12px;color:#9ca3af;text-align:center;padding:20px">Dados não encontrados.</p>'
    :'<div class="tbl-wrap"><table><thead><tr><th>EDT</th><th>Atividade</th><th style="text-align:center">Real</th><th style="text-align:center">Prev.</th><th style="text-align:center">Desvio</th><th style="text-align:center">Término</th><th>Área</th><th>Responsável</th><th style="width:28px"></th></tr></thead><tbody>'+topRows+'</tbody></table></div>')
    +'</div>'

    +buildConclSection(concl)

    +buildTopAvancos(d.allActs, atualDate, antDate)

    +'<div class="card-full"><div class="ct">Resumo executivo</div><div class="rs-grid">'
    +'<div class="rs-item"><div class="rs-bar" style="background:#10b981;min-height:44px"></div><div><div class="rs-t">Situação geral</div><div class="rs-p">Avanço de '+d.rPct.toFixed(1)+'%, superando em '+d.dPct.toFixed(2)+' p.p. o previsto ('+d.pPct.toFixed(1)+'%). Projeto adiantado.</div></div></div>'
    +'<div class="rs-item"><div class="rs-bar" style="background:#ef4444;min-height:44px"></div><div><div class="rs-t">Pontos de atenção</div><div class="rs-p">'+d.atrs+' atividades atrasadas ('+Math.round(d.atrs/d.totAc*100)+'% do total).</div></div></div>'
    +'<div class="rs-item"><div class="rs-bar" style="background:#f59e0b;min-height:44px"></div><div><div class="rs-t">Principais causas</div><div class="rs-p">Aguardando adequação de piso/civil (ADM Brasil). Peças e materiais não entregues no site (Elevador 2531, correntes).</div></div></div>'
    +'<div class="rs-item"><div class="rs-bar" style="background:#2563eb;min-height:44px"></div><div><div class="rs-t">Ação requerida</div><div class="rs-p">Priorizar liberação de frentes civis, entrega do Elevador 2531 e materiais pendentes no site.</div></div></div>'
    +'</div></div>'
    +'<footer>Fonte: Cronograma ADM (MS Project) · Área 25001 — Ampliação Preparação Atual · Atualização automática via Google Sheets</footer>';

  renderStatusChart(sd, d.allActs);
  renderAvancosChart(d.allActs, atualDate, antDate);
  if(chartDonut) chartDonut.destroy();
  chartDonut=new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:d.devs.map(function(v){return v.nm;}),datasets:[{data:d.devs.map(function(v){return v.qt;}),backgroundColor:d.devs.map(function(v){return v.cor;}),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{display:false},datalabels:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+c.raw+' desvios';}}}}}});

  if(chartCurva) chartCurva.destroy();
  if(curva&&curva.labels.length>0){
    chartCurva=new Chart(document.getElementById('curvaChart'),{type:'line',data:{labels:curva.labels,datasets:[
      {label:'Previsto Acumulado',data:curva.previsto,borderColor:'#2563eb',borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:false,spanGaps:true,backgroundColor:'transparent'},
      {label:'Realizado Acumulado',data:curva.realizado,borderColor:'#f59e0b',borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:'origin',backgroundColor:'rgba(5,120,80,0.13)',spanGaps:true},
      {label:'Tendência Acumulada',data:curva.tendencia,borderColor:'#10b981',borderDash:[6,3],borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:false,spanGaps:true,backgroundColor:'transparent'}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+(c.raw!=null?c.raw.toFixed(1)+'%':'—');}}},filler:{propagate:false},datalabels:{display:false}},
      scales:{
        x:{title:{display:true,text:'Data',font:{size:11},color:'#6b7280'},ticks:{font:{size:10},color:'#9ca3af',maxRotation:0,autoSkip:true,maxTicksLimit:9},grid:{color:'#f3f4f6'}},
        y:{min:0,max:100,title:{display:true,text:'% Acumulado',font:{size:11},color:'#6b7280'},ticks:{font:{size:10},color:'#9ca3af',stepSize:10,callback:function(v){return v+'%';}},grid:{color:'#f3f4f6'}}
      }
    }});
  } else {
    var el=document.getElementById('curvaChart');
    if(el) el.parentElement.innerHTML='<p style="text-align:center;padding:40px;color:#9ca3af;font-size:12px">Curva S não carregada.</p>';
  }
}

function showError(msg) {
  var ts=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('app').innerHTML='<div class="hdr"><div><div class="hdr-co">Irmãos Passaúra · ADM do Brasil</div><h1>Relatório Gerencial — Montagem Mecânica</h1></div><div class="hdr-r"><div class="hdr-date">'+ts+'</div><button class="btn-ref" onclick="init()">↺ Tentar novamente</button></div></div><div class="err-box"><strong>⚠ Não foi possível carregar os dados.</strong><br>Erro: '+msg+'</div>';
}

function init() {
  var btn=document.querySelector('.btn-ref');
  if(btn){btn.disabled=true;btn.textContent='↺ Carregando...';}
  var ts=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  Promise.all([
    fetchGviz(SHEET_ID,GID,null,true), // noFilter: ignora filtro ativo da aba
    fetchGviz(SHEET_ID_CURVA,GID_CURVA).catch(function(e){console.warn('Curva:',e.message);return null;}),
    fetchGviz(SHEET_ID,SHEET_CONCLUIDAS).catch(function(e){console.warn('Concluídas:',e.message);return null;}),
    fetchGviz(SHEET_ID,SHEET_ANTERIOR).catch(function(e){console.warn('Anterior:',e.message);return null;}),
    fetchGviz(SHEET_ID_STATUS,GID_STATUS,'A3:B8').catch(function(e){console.warn('Status:',e.message);return null;})
  ]).then(function(results){
    try{
      var d=parseRelatorio(results[0]);
      var atualDate=parseControlDate(results[0])||ts.slice(0,5);
      var antDate=results[3]?parseControlDate(results[3]):ANTERIOR_DATE;
      if(!antDate) antDate=ANTERIOR_DATE;
      var sd=results[4]?parseStatusDist(results[4]):null;
      render(d,results[1]?parseCurva(results[1]):null,results[2]?parseConcluidas(results[2]):null,ts,atualDate,antDate,sd);
    }catch(err){console.error(err);showError(err.message);}
  }).catch(function(e){showError(e.message);});
}

init();
</script>
</body>
</html>
