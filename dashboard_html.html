function fmtEfDate(v){
  if(!v&&v!==0) return null;
  if(typeof v==='number'&&v>10000){
    var dn=new Date(Math.round((v-25569)*86400000));
    return ('0'+dn.getUTCDate()).slice(-2)+'/'+('0'+(dn.getUTCMonth()+1)).slice(-2);
  }
  var s=String(v).toLowerCase().replace(/\./g,'').trim();
  // "27/abr", "04/mai", "7-abr"
  var m=s.match(/^(\d{1,2})[\-\/\s]([a-z]{3})/);
  if(m&&EF_MESES[m[2]]) return ('0'+m[1]).slice(-2)+'/'+('0'+EF_MESES[m[2]]).slice(-2);
  // Date(yyyy,m,d)
  m=String(v).match(/Date\((\d+),(\d+),(\d+)/);
  if(m) return ('0'+m[3]).slice(-2)+'/'+('0'+(+m[2]+1)).slice(-2);
  // mm/dd/yyyy ou dd/mm/yyyy
  m=String(v).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-]\d{2,4}/);
  if(m){var a=+m[1],b=+m[2]; return a<=12&&b<=31?('0'+b).slice(-2)+'/'+('0'+a).slice(-2):(b>12?('0'+b).slice(-2)+'/'+('0'+a).slice(-2):('0'+a).slice(-2)+'/'+('0'+b).slice(-2));}
  return null;
}

function weekdayEfPt(dt){
  var p=String(dt).split('/'),d=+p[0],m=+p[1];
  var names=['domingo','segunda-feira','ter\u00e7a-feira','quarta-feira','quinta-feira','sexta-feira','s\u00e1bado'];
  if(!d||!m)return '';
  return names[new Date(2026,m-1,d).getDay()];
}

function parseGvizJson(txt){
  var json;
  try{json=JSON.parse(txt.replace(/^[^{]*/,'').replace(/[^}]*$/,''));}
  catch(e){json=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));}
  return json;
}

function loadGvizJsonp(sheetId,sheetRef,range){
  return new Promise(function(resolve,reject){
    var cb='gvizCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    var s=document.createElement('script');
    var done=false;
    window[cb]=function(json){
      if(done)return;done=true;
      try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(s.parentNode)s.parentNode.removeChild(s);
      resolve(json);
    };
    s.onerror=function(){
      if(done)return;done=true;
      try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('GViz JSONP falhou'));
    };
    var ref=/^\d+$/.test(String(sheetRef))?'gid='+sheetRef:'sheet='+encodeURIComponent(sheetRef);
    s.src='https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&'+ref+'&range='+encodeURIComponent(range)+'&_cb='+Date.now();
    document.head.appendChild(s);
    setTimeout(function(){if(!done)s.onerror();},12000);
  });
}

  var raw=trs.map(function(tr){

  }).filter(function(row){return row.some(function(v){return v!=='';});});
  if(!raw.length) return null;
  var headerIdx=-1;
  for(var h=0;h<raw.length;h++){
    var joined=raw[h].join('|').toUpperCase();
    if(joined.indexOf('TURNO')>=0&&joined.indexOf('MÃO DE OBRA')>=0){headerIdx=h;break;}
  }
  if(headerIdx<0) return null;
  var header=raw[headerIdx].slice(), lastDate='';

    return {c:row.map(function(v){return {v:v};})};
  }), []);
}

function parseCsvLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var ch=line.charAt(i),nx=line.charAt(i+1);
    if(ch==='"'&&q&&nx==='"'){cur+='"';i++;continue;}
    if(ch==='"'){q=!q;continue;}
    if(ch===','&&!q){out.push(cur.trim());cur='';continue;}
    cur+=ch;
  }
  out.push(cur.trim());
  return out;
}

function parseEfetivoCsv(txt){
  if(txt.indexOf(',')<0||txt.indexOf('\n')<0) return null;
  var raw=txt.replace(/\r/g,'').split('\n').map(parseCsvLine).filter(function(row){
    return row.some(function(v){return v!=='';});
  });
  if(!raw.length) return null;
  var headerIdx=-1;
  for(var h=0;h<raw.length;h++){
    var joined=raw[h].join('|').toUpperCase();
    if(joined.indexOf('TURNO')>=0&&joined.indexOf('OBRA')>=0){headerIdx=h;break;}

  var header=raw[headerIdx].slice(), lastDate='';
  for(var ci=0;ci<header.length;ci++){

    if(ci>=2&&lastDate&&header[ci]==='') header[ci]=lastDate;
  }

//   Col A: TURNO (DIA / NOITE)
//   Col B: MÃO DE OBRA (DIRETA / INDIRETA)

// Linha de datas (row 16 da planilha) vira cols[] no GViz
function parseEfetivo(txt){
  var json;
  try{json=parseGvizJson(txt);}
  catch(e){return parseEfetivoCsv(txt)||parseEfetivoHtml(txt);}
  if(!json||!json.table) return null;
  var cols=json.table.cols||[], rows=json.table.rows||[];
  return parseEfetivoRows(rows, cols);
}

function parseEfetivoRows(rows, cols){
  if(!rows.length) return null;

  // ── Datas: de cols[] primeiro, depois varre rows ─────────────────────
  var dateCols=[];
  cols.forEach(function(col,ci){
    var label=fmtEfDate(col.label||col.id);
    if(label) dateCols.push({ci:ci,label:label});
  });
  var dataStart=0;
  if(!dateCols.length){
    for(var r=0;r<Math.min(20,rows.length);r++){
      if(!rows[r]||!rows[r].c) continue;
      var cnt=0; rows[r].c.forEach(function(c){if(c&&fmtEfDate(c.v||c.f))cnt++;});
      if(cnt>=3){
        rows[r].c.forEach(function(cell,ci){if(!cell)return;var l=fmtEfDate(cell.v||cell.f);if(l)dateCols.push({ci:ci,label:l});});
        dataStart=r+1; break;
      }
    }
  }
  if(!dateCols.length) return null;

  // ── Detecção de TURNO (DIA/NOITE) e MÃO DE OBRA (DIRETA/INDIRETA)
  //    Verifica col[0], col[1] e col[2] para máxima flexibilidade ─────────
  var dirDiaIdx=-1,indDiaIdx=-1,dirNtIdx=-1,indNtIdx=-1;
  var inDia=false,inNoite=false;
  var dirAll=[],indAll=[]; // fallback: coleta todos sem turno

  rows.forEach(function(row,ri){
    if(ri<dataStart||!row||!row.c) return;
    var labels=[];
    for(var c=0;c<Math.min(4,row.c.length);c++){
      labels.push(String(row.c[c]?row.c[c].v||row.c[c].f||'':'').trim().toUpperCase());
    }
    var hasLabel=function(k){return labels.some(function(l){return l===k||l.indexOf(k)>=0;});};

    var isDir=hasLabel('DIRETA')&&!hasLabel('INDIRETA');
    var isInd=hasLabel('INDIRETA');
    var isDia=hasLabel('DIA')&&!hasLabel('NOITE')&&!hasLabel('TOTAL');
    var isNoite=hasLabel('NOITE')&&!hasLabel('TOTAL');

    if(isDia){inDia=true;inNoite=false;if(!isDir&&!isInd)return;}
    if(isNoite){inNoite=true;inDia=false;if(!isDir&&!isInd)return;}
    if(hasLabel('TOTAL')&&labels.some(function(l){return l.indexOf('GERAL')>=0||l.indexOf('TOTAL')>=0;})){inDia=inNoite=false;return;}

    if(inDia){
      if(isDir&&dirDiaIdx<0) dirDiaIdx=ri;
      if(isInd&&indDiaIdx<0) indDiaIdx=ri;
    } else if(inNoite){
      if(isDir&&dirNtIdx<0) dirNtIdx=ri;
      if(isInd&&indNtIdx<0) indNtIdx=ri;
    } else {
      if(isDir) dirAll.push(ri);
      if(isInd) indAll.push(ri);
    }
  });

  // Fallback: se não achou com DIA/NOITE, usa ordem natural (1º=DIA, 2º=NOITE)
  if(dirDiaIdx<0&&dirAll.length>=1) dirDiaIdx=dirAll[0];
  if(indDiaIdx<0&&indAll.length>=1) indDiaIdx=indAll[0];
  if(dirNtIdx<0 &&dirAll.length>=2) dirNtIdx =dirAll[1];
  if(indNtIdx<0 &&indAll.length>=2) indNtIdx =indAll[1];
  if(dirDiaIdx<0){
    var work=[];
    rows.forEach(function(row,ri){
      if(ri<dataStart||!row||!row.c)return;
      var l0=String(row.c[0]?(row.c[0].v||row.c[0].f||''):'').toUpperCase();
      if(l0.indexOf('DIRETA')>=0||l0.indexOf('INDIRETA')>=0) work.push({ri:ri,l:l0});
    });
    if(work.length>=4){
      dirDiaIdx=work[0].ri; indDiaIdx=work[1].ri;
      dirNtIdx=work[2].ri; indNtIdx=work[3].ri;
    }
  }
  if(dirDiaIdx<0) return null;

  var dirDiaRow=rows[dirDiaIdx].c;
  var indDiaRow=indDiaIdx>=0?rows[indDiaIdx].c:null;
  var dirNtRow =dirNtIdx >=0?rows[dirNtIdx ].c:null;
  var indNtRow =indNtIdx >=0?rows[indNtIdx ].c:null;
  var hasPairs=dirNtRow!==null;

  // ── Remove subtotais ─────────────────────────────────────────────────
  function rowNum(row,ci){return row&&ci<row.length&&row[ci]?+(row[ci].v||0):0;}
  var realCols=dateCols.filter(function(dc){
    var total=rowNum(dirDiaRow,dc.ci)+rowNum(indDiaRow,dc.ci)+rowNum(dirNtRow,dc.ci)+rowNum(indNtRow,dc.ci);
    return total>0&&total<300; // mantém dias parciais e exclui totais mensais/gerais
  });

  // ── Detecta pares DIA/NOITE por datas repetidas nas colunas ──────────
  if(!hasPairs){
    for(var pp=0;pp<realCols.length-1;pp++){
      if(realCols[pp].label===realCols[pp+1].label){hasPairs=true;break;}
    }
  }

  // Últimas 2 semanas. A publicação HTML/CSV vem da data mais nova para a mais antiga.
  function dateKey(lbl){var p=lbl.split('/');return (+p[1])*100+(+p[0]);}
  var desc=realCols.length>1&&dateKey(realCols[0].label)>dateKey(realCols[realCols.length-1].label);
  var last2w=hasPairs?(desc?realCols.slice(0,20):realCols.slice(-20)):(desc?realCols.slice(0,14):realCols.slice(-14));

  // ── Constrói arrays ──────────────────────────────────────────────────
  var dates=[],dDia=[],dNt=[],iDia=[],iNt=[];
  var i=0;
  while(i<last2w.length){
    var c1=last2w[i];
    var c2=(hasPairs&&i+1<last2w.length&&last2w[i+1].label===c1.label)?last2w[i+1]:null;
    dates.push(c1.label);
    var dv1=rowNum(dirDiaRow,c1.ci);
    var iv1=rowNum(indDiaRow,c1.ci);
    if(c2){
      dDia.push(dv1); dNt.push(rowNum(dirNtRow,c2.ci));
      iDia.push(iv1); iNt.push(rowNum(indNtRow,c2.ci));
      i+=2;
    } else {
      dDia.push(dv1); dNt.push(rowNum(dirNtRow,c1.ci));
      iDia.push(iv1); iNt.push(rowNum(indNtRow,c1.ci));
      i++;
    }
  }
  if(!dates.length) return null;

  // ── Inverte para exibir da data mais antiga para a mais atual ─────────
  if(desc){dates.reverse(); dDia.reverse(); dNt.reverse(); iDia.reverse(); iNt.reverse();}

  return {dates:dates,hasPairs:hasPairs,ind:{dia:iDia,noite:iNt},dir:{dia:dDia,noite:dNt}};
}

function parseFuncaoQuantJson(json){
  var rows=json.table.rows||[];
  if(!rows.length)return null;
  var hasFuncao=false;
  for(var hr=0;hr<Math.min(4,rows.length);hr++){
    var hrow=rows[hr]&&rows[hr].c?rows[hr].c:[];
    for(var hc=0;hc<hrow.length;hc++){
      var hv=hrow[hc]?String(hrow[hc].v||hrow[hc].f||'').toUpperCase():'';
      if(hv.indexOf('FUN')>=0){hasFuncao=true;break;}
    }
    if(hasFuncao)break;
  }
  var dateRow=rows[0]&&rows[0].c?rows[0].c:[], dateCol=-1, date='';
  for(var c=2;c<dateRow.length;c++){
    var cell=dateRow[c], dt=cell?fmtEfDate(cell.f!=null?cell.f:cell.v):null;
    if(dt){dateCol=c;date=dt;break;}
  }
  if(dateCol<0)return null;
  var result={date:date,weekday:weekdayEfPt(date),total:0,direta:[],indireta:[],missingFuncao:!hasFuncao};
  var sec='';
  function cellText(row,ci){var cell=row&&row.c&&row.c[ci];return cell?(cell.v!=null?String(cell.v):String(cell.f||'')):'';}
  function cellNum(row,ci){var cell=row&&row.c&&row.c[ci];var v=cell?(cell.v!=null?cell.v:cell.f):0;var n=Number(v);return isNaN(n)?0:n;}
  for(var r=1;r<rows.length;r++){
    var label=cellText(rows[r],0).trim().toUpperCase();
    var func=cellText(rows[r],1).trim();
    if(label.indexOf('TOTAL')>=0){result.total=cellNum(rows[r],dateCol);break;}
    if(label.indexOf('INDIRETA')>=0)sec='indireta';
    else if(label.indexOf('DIRETA')>=0)sec='direta';
    if(!func||!sec)continue;
    var qtd=cellNum(rows[r],dateCol);
    if(qtd>0)result[sec].push({func:func,qtd:qtd});
  }
  if(!result.total)result.total=result.direta.concat(result.indireta).reduce(function(a,x){return a+x.qtd;},0);
  if(result.missingFuncao){
    result.sourceMessage='A Tabela 02 est\u00e1 retornando o resumo por M\u00e3o de Obra, n\u00e3o por Fun\u00e7\u00e3o Medi\u00e7\u00e3o.';
  }
  return result;
}

  function weekdayPt(dt){
    return weekdayEfPt(dt);
  }
  var labels=[],indData=[],dirData=[];
  ef.dates.forEach(function(dt,i){
    if(ef.hasPairs){labels.push('DIA','NOITE');indData.push(ef.ind.dia[i]||0,ef.ind.noite[i]||0);dirData.push(ef.dir.dia[i]||0,ef.dir.noite[i]||0);}
    else{labels.push(dt);indData.push(ef.ind.dia[i]||0);dirData.push(ef.dir.dia[i]||0);}
  });
  var capDates=ef.dates.slice(),capWeekdays=ef.dates.map(weekdayPt),capInd=indData.slice(),capDir=dirData.slice(),capPairs=ef.hasPairs;

  // Plugin A — data centralizada abaixo do par DIA/NOITE
  var datePlugin={id:'efDates',afterDraw:function(chart){
    if(!capPairs)return;
    var ctx=chart.ctx,xs=chart.scales.x,yB=chart.chartArea.bottom;
    ctx.save();ctx.textAlign='center';
    capDates.forEach(function(dt,i){
      var x=(xs.getPixelForValue(i*2)+xs.getPixelForValue(i*2+1))/2;
      ctx.font='10px "Segoe UI",sans-serif';ctx.fillStyle='#6b7280';ctx.fillText(dt,x,yB+36);
      ctx.font='9px "Segoe UI",sans-serif';ctx.fillStyle='#9ca3af';ctx.fillText(capWeekdays[i]||'',x,yB+52);
    });
    ctx.restore();
  }};

  var divPlugin={id:'efDividers',afterDraw:function(chart){
    if(!capPairs)return;
    var ctx=chart.ctx,xs=chart.scales.x,area=chart.chartArea;
    ctx.save();
    ctx.strokeStyle='rgba(17,24,39,.28)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    for(var i=1;i<capDates.length;i++){
      var x=(xs.getPixelForValue(i*2-1)+xs.getPixelForValue(i*2))/2;
      ctx.beginPath();
      ctx.moveTo(x,area.top+2);
      ctx.lineTo(x,area.bottom+4);
      ctx.stroke();
    }
    ctx.restore();
  }};

  // Plugin B — total acima do par, centralizado nas barras
  var totPlugin={id:'efTotalsAbove',afterDatasetsDraw:function(chart){
    var ctx=chart.ctx,meta1=chart.getDatasetMeta(1);if(!meta1||!meta1.data.length)return;
    ctx.save();ctx.font='bold 11px "Segoe UI",sans-serif';ctx.textAlign='center';

      var barB=i1>=0?meta1.data[i1]:null;
      var xC=barB?(barA.x+barB.x)/2:barA.x,yT=barB?Math.min(barA.y,barB.y)-6:barA.y-6;
      var total=(capInd[i0]||0)+(capDir[i0]||0)+(i1>=0?(capInd[i1]||0)+(capDir[i1]||0):0);
      ctx.fillStyle='#374151';ctx.fillText(total,xC,yT);
    });
    ctx.restore();
  }};

  var xMax=0;for(var k=0;k<indData.length;k++)xMax=Math.max(xMax,(indData[k]||0)+(dirData[k]||0));
  xMax=Math.ceil(xMax/10)*10+10;

  Chart.register(ChartDataLabels);
  chartEfetivo=new Chart(el,{type:'bar',plugins:[ChartDataLabels,datePlugin,divPlugin,totPlugin],
    data:{labels:labels,datasets:[
      {label:'Indireta',data:indData,backgroundColor:'#c0392b',datalabels:{anchor:'center',align:'center',color:'#fff',font:{size:10,weight:'bold'},formatter:function(v){return v>0?v:'';}
      }},
      {label:'Direta',data:dirData,backgroundColor:'#2e6da4',datalabels:{anchor:'center',align:'center',color:'#fff',font:{size:11,weight:'bold'},formatter:function(v){return v>0?v:'';}
      }}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:22,bottom:capPairs?62:4}},
      scales:{
        x:{stacked:true,ticks:{font:{size:9},color:'#6b7280',maxRotation:0,autoSkip:false,padding:4},grid:{display:false}},
        y:{stacked:true,beginAtZero:true,max:xMax,ticks:{font:{size:10},color:'#9ca3af',stepSize:Math.ceil(xMax/8)},grid:{color:'rgba(0,0,0,.05)'}}
      },
      plugins:{legend:{display:false},datalabels:{},
        tooltip:{callbacks:{
          title:function(cs){var idx=cs[0].dataIndex;if(capPairs){var t=idx%2===0?'DIA':'NOITE';return t+' \u2014 '+capDates[Math.floor(idx/2)]+'/2026';}return capDates[idx]+'/2026';},
          label:function(c){return '  '+c.dataset.label+': '+c.raw;}
        }}
      }
    }
  });
  var tot=document.getElementById('efTotals');if(tot)tot.innerHTML='';

function parseCurva(rows) {
  var prevRowIdx=-1,realRowIdx=-1,tendRowIdx=-1,dateRowIdx=-1;
  for (var r=0;r<rows.length;r++) {
    if(!rows[r]||!rows[r].c) continue;
    var c0=rows[r].c[0], a=String(c0?(c0.v!=null?c0.v:(c0.f||'')):'' ).toLowerCase();
    if(a.indexOf('prev')>=0&&a.indexOf('acum')>=0) prevRowIdx=r;
    if(a.indexOf('real')>=0&&a.indexOf('acum')>=0) realRowIdx=r;
    if(a.indexOf('tend')>=0&&a.indexOf('acum')>=0) tendRowIdx=r;
  }
  for (var r2=0;r2<rows.length;r2++) {
    if(!rows[r2]||!rows[r2].c) continue;
    var cnt=0;
    for (var ci=0;ci<rows[r2].c.length;ci++) {
      var cell=rows[r2].c[ci]; if(!cell) continue;
      var vf=String(cell.f!=null?cell.f:(cell.v!=null?cell.v:'')).toLowerCase();
      if(/\d{1,2}[\-\/][a-z]{2,4}/.test(vf)) cnt++;
    }
    if(cnt>=5){dateRowIdx=r2;break;}
  }
  if(prevRowIdx<0||dateRowIdx<0) return {labels:[],previsto:[],realizado:[],tendencia:[]};
  var dateRow=rows[dateRowIdx],prevRow=rows[prevRowIdx];
  var realRow=realRowIdx>=0?rows[realRowIdx]:null;
  var tendRow=tendRowIdx>=0?rows[tendRowIdx]:null;
  var maxCol=Math.max(dateRow.c?dateRow.c.length:0,prevRow.c?prevRow.c.length:0);
  var labels=[],previsto=[],realizado=[],tendencia=[];
  for (var c2=1;c2<maxCol;c2++) {
    var dCell=dateRow.c&&dateRow.c[c2]; if(!dCell) continue;
    var dv=dCell.f!=null?dCell.f:(dCell.v!=null?dCell.v:null); if(!dv) continue;
    var ds=String(dv).toLowerCase().replace(/\.$/,'').trim();
    if(!/\d/.test(ds)) continue;
    if(/^[\d.e+\-]+$/.test(ds)) continue;
    var pCell=prevRow.c&&prevRow.c[c2],pv=pCell?(pCell.v!=null?pCell.v:pCell.f):null; if(pv==null) continue;
    labels.push(ds); previsto.push(cpct(pv));
    var rCell=realRow&&realRow.c&&realRow.c[c2],rv=rCell?(rCell.v!=null?rCell.v:rCell.f):null;
    realizado.push(rv!=null?cpct(rv):null);
    var tCell=tendRow&&tendRow.c&&tendRow.c[c2],tv=tCell?(tCell.v!=null?tCell.v:tCell.f):null;
    tendencia.push(tv!=null?cpct(tv):null);
  }
  return {labels:labels,previsto:previsto,realizado:realizado,tendencia:tendencia};
}

function parseConcluidas(rows) {
  var result={total:'',periodo:'',rows:[]};
  var headers=['#','EDT','Atividade','HH Prev.','% Anterior','% Atual','Início','Término Real'];
  var headerRowIdx=-1, startCol=-1;
  for (var r=0;r<rows.length;r++) {
    if(!rows[r]||!rows[r].c) continue;
    var cells=rows[r].c;
    var rowText=cells.map(function(c){return c?String(c.v!=null?c.v:(c.f||'')).trim():'';});
    var rowStr=rowText.join('|').toLowerCase();
    if(rowStr.indexOf('total de atividades')>=0) {
      for(var ci=0;ci<rowText.length;ci++) {
        if(rowText[ci].toLowerCase().indexOf('total de atividades')>=0){result.total=rowText[ci+1]||rowText[ci+2]||'';break;}
      }
    }
    if(rowStr.indexOf('per')>=0&&rowStr.indexOf('nalise')>=0) {
      for(var ci2=0;ci2<rowText.length;ci2++) {
        var rv2=rowText[ci2].toLowerCase();
        if(rv2.indexOf('per')>=0&&rv2.indexOf('nali')>=0){result.periodo=rowText[ci2+1]||rowText[ci2+2]||'';break;}
      }
    }
    if(rowStr.indexOf('edt')>=0&&rowStr.indexOf('atividade')>=0&&headerRowIdx<0) {
      headerRowIdx=r;
      for(var hi=0;hi<rowText.length;hi++){if(rowText[hi]==='#'){startCol=hi;break;}}
      continue;
    }
    if(headerRowIdx>=0&&r>headerRowIdx&&startCol>=0) {
      if(!rowText.join('').trim()) continue;
      if(rowStr.indexOf('legenda')>=0||rowStr.indexOf('relat')>=0) break;
      var rowData=[];
      for(var di=startCol;di<startCol+8;di++) rowData.push(rowText[di]||'');
      if(rowData.filter(function(v){return v!=='';}).length>=2) result.rows.push(rowData);
    }
  }
  result.headers=headers;
  return result;
}

      return '<th'+(center?' style="text-align:center"':'')+'>'+h+'</th>';

    +'<div id="efTotals" style="display:flex;border:0.5px solid #e8eaed;border-radius:6px;overflow:hidden"></div>'
    +'<div style="display:flex;gap:12px;font-size:11px;color:#6b7280">'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#c0392b;display:inline-block"></span>Indireta</span>'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#2e6da4;display:inline-block"></span>Direta</span>'
    +'</div></div></div>'
    +'<div id="efStatus" style="font-size:11px;color:#9ca3af;padding:0 14px 4px"></div>'
    +'<div style="position:relative;height:300px"><canvas id="efChart"></canvas></div>'
    +'<div id="funcaoTable" style="font-size:11.5px;color:#374151"></div>'
    +'</div>'

    +'<footer>Fonte: Cronograma ADM (MS Project) · Área 25001 — Ampliação Preparação Atual · Atualização automática via Google Sheets</footer>';

  renderStatusChart(sd);
  if(chartDonut) chartDonut.destroy();
  chartDonut=new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:d.devs.map(function(v){return v.nm;}),datasets:[{data:d.devs.map(function(v){return v.qt;}),backgroundColor:d.devs.map(function(v){return v.cor;}),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{display:false},datalabels:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+c.raw+' desvios';}}}}}});

  if(chartCurva) chartCurva.destroy();
  if(curva&&curva.labels.length>0){
    chartCurva=new Chart(document.getElementById('curvaChart'),{type:'line',data:{labels:curva.labels,datasets:[
      {label:'Previsto Acumulado',data:curva.previsto,borderColor:'#2563eb',borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:false,spanGaps:true,backgroundColor:'transparent'},
      {label:'Realizado Acumulado',data:curva.realizado,borderColor:'#f59e0b',borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:'origin',backgroundColor:'rgba(5,120,80,0.13)',spanGaps:true},
      {label:'Tendência Acumulada',data:curva.tendencia,borderColor:'#10b981',borderDash:[6,3],borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3,fill:false,spanGaps:true,backgroundColor:'transparent'}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},datalabels:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+(c.raw!=null?c.raw.toFixed(1)+'%':'—');}}},filler:{propagate:false}},
      scales:{
        x:{title:{display:true,text:'Data',font:{size:11},color:'#6b7280'},ticks:{font:{size:10},color:'#9ca3af',maxRotation:0,autoSkip:true,maxTicksLimit:9},grid:{color:'#f3f4f6'}},
        y:{min:0,max:100,title:{display:true,text:'% Acumulado',font:{size:11},color:'#6b7280'},ticks:{font:{size:10},color:'#9ca3af',stepSize:10,callback:function(v){return v+'%';}},grid:{color:'#f3f4f6'}}
      }
    }});
  } else {
    var el=document.getElementById('curvaChart');
    if(el) el.parentElement.innerHTML='<p style="text-align:center;padding:40px;color:#9ca3af;font-size:12px">Curva S não carregada.</p>';
  }
}

function showError(msg) {
  var ts=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('app').innerHTML='<div class="hdr"><div><div class="hdr-co">Irmãos Passaúra · ADM do Brasil</div><h1>Relatório Gerencial — Montagem Mecânica</h1></div><div class="hdr-r"><div class="hdr-date">'+ts+'</div><button class="btn-ref" onclick="init()">↺ Tentar novamente</button></div></div><div class="err-box"><strong>⚠ Não foi possível carregar os dados.</strong><br>Erro: '+msg+'</div>';
}

function init() {
  var btn=document.querySelector('.btn-ref');
  if(btn){btn.disabled=true;btn.textContent='↺ Carregando...';}
  var ts=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  Promise.all([
    fetchGviz(SHEET_ID,GID),
    fetchGviz(SHEET_ID_CURVA,GID_CURVA).catch(function(e){console.warn('Curva:',e.message);return null;}),
    fetchGviz(SHEET_ID,SHEET_CONCLUIDAS).catch(function(e){console.warn('Concluídas:',e.message);return null;}),
    fetchGviz(SHEET_ID,GID_STATUS,'B10:D15').catch(function(e){console.warn('Status:',e.message);return null;}),
    fetchGviz(SHEET_ID,'1243438454','B3:B3').catch(function(e){console.warn('DataCorte:',e.message);return null;})
  ]).then(function(results){
    try{
      var d=parseRelatorio(results[0]);
      var atualDate=null;
      if(results[4]&&results[4][0]&&results[4][0].c&&results[4][0].c[0])atualDate=parseControlDate([results[4][0]]);
      if(!atualDate)atualDate=parseControlDate(results[0])||ts.slice(0,5);
      var sd=results[3]?parseStatusDist(results[3]):null;
      render(d,results[1]?parseCurva(results[1]):null,results[2]?parseConcluidas(results[2]):null,ts,atualDate,sd);
      // Efetivo: usa somente a publicaÃ§Ã£o informada pelo usuÃ¡rio, sem fallback antigo.
      var _efStatus=document.getElementById('efStatus');
      if(_efStatus) _efStatus.textContent='Carregando...';
      var _efBust='&_cb='+(Date.now());
      (function tryFuncoes(idx){
        var gids=(typeof EF_FUNCOES_GIDS!=='undefined'&&EF_FUNCOES_GIDS.length)?[EF_FUNCOES_SHEET].concat(EF_FUNCOES_GIDS):[EF_FUNCOES_SHEET,EF_FUNCOES_GID];
        if(idx>=gids.length){renderFuncaoQuant(null);return;}
        loadGvizJsonp(EF_SHEET,gids[idx],EF_FUNCOES_RANGE)
          .then(function(json){
            var fq=parseFuncaoQuantJson(json);
            if(fq&&!fq.missingFuncao&&(fq.direta.length||fq.indireta.length))renderFuncaoQuant(fq);
            else tryFuncoes(idx+1);
          })
          .catch(function(){tryFuncoes(idx+1);});
      })(0);
      var _efUrls=[
        'https://docs.google.com/spreadsheets/d/'+EF_SHEET+'/gviz/tq?tqx=out:json&gid='+EF_GID+'&range=B2:T9'+_efBust,
        'https://docs.google.com/spreadsheets/d/e/'+EF_PUB+'/pub?gid='+EF_GID+'&single=true&output=csv'+_efBust,
        'https://docs.google.com/spreadsheets/d/e/'+EF_PUB+'/pubhtml/sheet?headers=false&gid='+EF_GID+_efBust
      ];
      (function tryEf(idx){
        if(idx>=_efUrls.length){
          if(_efStatus) _efStatus.style.color='#dc2626';
          if(_efStatus) _efStatus.textContent='Usando dados de referência — planilha acessível via GViz?';
          if(_efStatus) _efStatus.textContent='Nao foi possivel carregar a planilha publicada.';
          renderEfetivo({dates:[],hasPairs:true,ind:{dia:[],noite:[]},dir:{dia:[],noite:[]}});
          return;
        }
        fetch(_efUrls[idx],{cache:'no-store'}).then(function(r){return r.text();})
          .then(function(t){
            var d=parseEfetivo(t);
            if(d&&d.dates&&d.dates.length>0){
              if(_efStatus){_efStatus.textContent='';_efStatus.style.color='';}
              renderEfetivo(d);
            } else { console.warn('Efetivo URL '+idx+': sem dados'); tryEf(idx+1); }
          }).catch(function(){tryEf(idx+1);});
      })(0);
    }catch(err){console.error(err);showError(err.message);}
  }).catch(function(e){showError(e.message);});
}

init();
</script>
